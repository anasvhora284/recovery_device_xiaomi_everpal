name: AERA build (everpal)

# Steps live in .github/aera-ci.sh (changing it needs no `workflow` token scope).
# Output: the AERA zip + boot.img as a workflow artifact (patch the installer locally with tools/patch_installer.py).
on:
  push:
    branches: [aera-16.0]
    paths:
      - .github/**
      - aera-patches/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SRC: /home/runner/aera
      OUT_DIR: /mnt/out
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree
      - name: Free disk space
        run: bash tree/.github/aera-ci.sh free
      - name: Install build tools
        run: bash tree/.github/aera-ci.sh tools
      - name: Sync AERA source
        run: bash tree/.github/aera-ci.sh sync
      - name: Apply AERA source patches
        run: bash tree/.github/aera-ci.sh patch
      - name: Build
        run: bash tree/.github/aera-ci.sh build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aera-everpal-${{ github.run_number }}
          path: |
            ${{ env.OUT_DIR }}/target/product/everpal/*.zip
            ${{ env.OUT_DIR }}/target/product/everpal/boot.img
          if-no-files-found: error
          retention-days: 14
